apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-basic-app-config
  labels:
    app: fastapi-basic-app
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  OTEL_SERVICE_NAME: fastapi-basic-app
  # Point this at the OTLP gRPC endpoint for Jaeger or an OpenTelemetry Collector.
  OTEL_EXPORTER_OTLP_ENDPOINT: host.docker.internal:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
