apiVersion: v1
kind: Service
metadata:
  name: fastapi-basic-app-service-clusterip
  labels:
    app: fastapi-basic-app
spec:
  type: ClusterIP
  selector:
    app: fastapi-basic-app
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-basic-app-service-nodeport
  labels:
    app: fastapi-basic-app
spec:
  type: NodePort
  selector:
    app: fastapi-basic-app
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: http
